<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#163377">
<title>Orlando Massango · Sumol Compal</title>
<meta name="description" content="Gestor de Mercados · Sumol Compal Moçambique">
<link rel="icon" href="../assets/simbolo.png">
<link rel="apple-touch-icon" href="../assets/simbolo.png">
<style>
@font-face{font-family:SCT;src:url(../assets/SumolCompalType-Book.ttf) format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:SCT;src:url(../assets/SumolCompalType-Medium.ttf) format('truetype');font-weight:500;font-display:swap}
@font-face{font-family:SCT;src:url(../assets/SumolCompalType-Bold.ttf) format('truetype');font-weight:700;font-display:swap}
:root{--navy:#163377;--navy-2:#0f2659;--blue:#2478FA;--green:#009100;--ink:#16203a;--muted:#5b6582;--line:#e3e7f1;--bg:#f3f5fa;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:SCT,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
.wrap{width:100%;max-width:440px;padding:0 0 32px}
.hero{background:var(--navy);padding:34px 24px 76px;text-align:center;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.hero .sym{width:74px;height:auto;display:block;margin:0 auto 14px}
.hero .wm{width:150px;height:auto;display:block;margin:0 auto}
.card{background:var(--card);margin:-50px 16px 0;border-radius:22px;padding:26px 22px 22px;box-shadow:0 10px 30px rgba(22,51,119,.12);position:relative}
h1{font-weight:700;font-size:27px;line-height:1.15;color:var(--navy);letter-spacing:-.01em}
.role{margin-top:8px;font-weight:500;font-size:16px;line-height:1.3}
.role-en{margin-top:2px;font-size:14px;color:var(--muted);line-height:1.3}
.org{margin-top:10px;font-size:13px;color:var(--muted)}
.save{margin-top:22px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--navy);color:#fff;text-decoration:none;font-weight:700;font-size:16px;padding:16px;border-radius:14px}
.save:active{background:var(--navy-2)}
.actions{margin-top:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.act{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 4px 11px;border:1px solid var(--line);border-radius:14px;text-decoration:none;color:var(--navy);font-weight:500;font-size:13px;background:#fff}
.act.wa{color:var(--green)}
.act:active{background:var(--bg)}
svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.save svg{width:22px;height:22px}
.info{list-style:none;margin:18px 16px 0;background:var(--card);border-radius:18px;overflow:hidden}
.info li+li{border-top:1px solid var(--line)}
.info a{display:flex;align-items:center;gap:14px;padding:15px 18px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.3;word-break:break-word}
.info svg{color:var(--navy);width:21px;height:21px}
.info small{display:block;color:var(--muted);font-size:12px;margin-bottom:1px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:22px}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <img class="sym" src="../assets/simbolo.png" alt="">
    <img class="wm" src="../assets/logotipo-branco.png" alt="Sumol Compal Moçambique">
  </header>
  <section class="card">
    <h1>Orlando Massango</h1>
    <p class="role">Gestor de Mercados</p>
    <p class="role-en">Market Manager</p>
    <a class="save" href="contacto.vcf" download="orlando-massango.vcf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 19v-1.5a3.5 3.5 0 0 0-3.5-3.5h-4A3.5 3.5 0 0 0 4 17.5V19" /><circle cx="9.5" cy="7.5" r="3.5"/><path d="M19 8v6M16 11h6"/></svg>Guardar contacto</a>
    <div class="actions">
      <a class="act wa" href="https://wa.me/258843210802?text=Ol%C3%A1%20Orlando%2C%20"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 20.5l1.3-4.2A8.5 8.5 0 1 1 8 19.4z"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1.2-1.6-2.2-1-1 .9a5 5 0 0 1-2.8-2.8l.9-1-1-2.2z" stroke-width="1.4"/></svg>WhatsApp</a>
      <a class="act" href="tel:+258843210802"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5L16 14l4 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/></svg>Ligar</a>
      <a class="act" href="mailto:orlandozacarias.massango@mz.sumolcompal.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg>Email</a>
    </div>
  </section>
  <ul class="info">
    <li><a href="tel:+258843210802"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3.5l1.5 4-2 1.5a11 11 0 0 0 6.5 6.5L16 14l4 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/></svg><span><small>Telefone</small>+258 84 321 0802</span></a></li>
    <li><a href="mailto:orlandozacarias.massango@mz.sumolcompal.com"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5l8.5 6.5 8.5-6.5"/></svg><span><small>Email</small>orlandozacarias.massango@mz.sumolcompal.com</span></a></li>
    <li><a href="https://maps.google.com/?q=Sumol+Compal+Av.+da+Namaacha+Km27+Boane+Mo%C3%A7ambique"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg><span><small>Morada</small>Av. da Namaacha Km27, Boane</span></a></li>
    <li><a href="https://www.sumolcompal.pt"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></svg><span><small>Website</small>www.sumolcompal.pt</span></a></li>
  </ul>
  <footer>Sumol Compal Moçambique</footer>
</main>
</body>
</html>
